<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Shree Kamala Secondary School, Dhungrebas — emblem.
       Redrawn from the school's rubber stamp: a double ring lettered
       "Shree Kamala Secondary School" over "Dhungrebas, Sindhuli" between two
       stars; inside, a six-pointed star with an open book at its centre, the
       letters K S S D S S in its points, and "Estd. 1951 AD". In the colours
       of the emblem painted on the school's signboard: royal blue, a saffron
       disc and a white star. The year on the stamp is smudged; 1951 AD agrees
       with the signboard's Estd. 2007 BS. Render: see README.md. -->
  <defs>
    <path id="top" d="M 58.3 190.1 A 142 142 0 1 1 341.7 190.1"/>
    <path id="bottom" d="M 78.8 270.0 A 140 140 0 0 0 321.2 270.0"/>
  </defs>

  <!-- rings -->
  <circle cx="200" cy="200" r="197" fill="#ffffff"/>
  <circle cx="200" cy="200" r="191" fill="none" stroke="#1d3b8f" stroke-width="6"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#1d3b8f" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="130" fill="#ec6b1c" stroke="#1d3b8f" stroke-width="5"/>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1d3b8f">
    <text font-size="27" letter-spacing="0.8">
      <textPath href="#top" startOffset="50%" text-anchor="middle">Shree Kamala Secondary School</textPath>
    </text>
    <text font-size="26" letter-spacing="0.6" dominant-baseline="hanging">
      <textPath href="#bottom" startOffset="50%" text-anchor="middle">Dhungrebas, Sindhuli</textPath>
    </text>
  </g>
  <polygon points="50.8,235.6 53.2,242.4 60.3,242.5 54.6,246.8 56.7,253.7 50.8,249.6 44.9,253.7 47.0,246.8 41.3,242.5 48.5,242.4" fill="#1d3b8f"/>
  <polygon points="349.2,235.6 351.5,242.4 358.7,242.5 353.0,246.8 355.1,253.7 349.2,249.6 343.3,253.7 345.4,246.8 339.7,242.5 346.8,242.4" fill="#1d3b8f"/>

  <!-- six-pointed star: two interlaced triangles, white with a blue rule -->
  <g fill="#ffffff" stroke="#1d3b8f" stroke-width="4.5" stroke-linejoin="round">
    <polygon points="200.0,96.0 290.1,252.0 109.9,252.0"/>
    <polygon points="200.0,304.0 109.9,148.0 290.1,148.0"/>
  </g>
  <polygon points="200.0,96.0 290.1,252.0 109.9,252.0" fill="none" stroke="#1d3b8f" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- the letters in the star's points -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="25" fill="#1d3b8f"
     text-anchor="middle" dominant-baseline="central">
    <text x="137.6" y="164.0">K</text>
    <text x="200.0" y="128.0">S</text>
    <text x="262.4" y="164.0">S</text>
    <text x="262.4" y="236.0">D</text>
    <text x="200.0" y="272.0">S</text>
    <text x="137.6" y="236.0">S</text>
  </g>

  <!-- Estd. 1951 AD, in the gaps either side of the star's lowest point -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#ffffff"
     text-anchor="middle" dominant-baseline="central">
    <text x="143.8" y="289.9" transform="rotate(32 143.8 289.9)">Estd.</text>
    <text x="256.2" y="289.9" transform="rotate(-32 256.2 289.9)">1951 AD</text>
  </g>

  <!-- open book at the centre -->
  <g stroke="#1d3b8f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 200 184 C 188 176, 172 175, 162 179 L 162 216 C 172 212, 188 213, 200 222 Z" fill="#ffffff"/>
    <path d="M 200 184 C 212 176, 228 175, 238 179 L 238 216 C 228 212, 212 213, 200 222 Z" fill="#ffffff"/>
    <line x1="200" y1="184" x2="200" y2="222"/>
  </g>
  <g stroke="#1d3b8f" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M 169 190 C 177 187, 186 188, 193 191"/>
    <path d="M 169 199 C 177 196, 186 197, 193 200"/>
    <path d="M 169 208 C 177 205, 186 206, 193 209"/>
    <path d="M 231 190 C 223 187, 214 188, 207 191"/>
    <path d="M 231 199 C 223 196, 214 197, 207 200"/>
    <path d="M 231 208 C 223 205, 214 206, 207 209"/>
  </g>
</svg>
